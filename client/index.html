<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CanvasCollab • Real-Time Collaborative Whiteboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="nav-left">
            <div class="brand">
                <span class="brand-icon">🎨</span>
                <span class="brand-name">CanvasCollab</span>
            </div>

            <div class="room-pill">
                <span class="room-label">Code:</span>
                <span id="current-room-badge" class="room-code-tag">...</span>
                
                <button id="copy-code-btn" class="icon-btn-subtle" title="Copy 6-character room code">
                    🔢 <span class="btn-text">Code</span>
                </button>
                <button id="copy-room-btn" class="icon-btn-subtle" title="Copy direct invite link">
                    📋 <span class="btn-text">Link</span>
                </button>

                <div class="pill-divider"></div>

                <button id="new-room-btn" class="icon-btn-highlight" title="Create a new room">
                    ➕ <span class="btn-text">New Room</span>
                </button>
                <button id="join-room-btn" class="icon-btn-subtle" title="Join another room using code or link">
                    🚪 <span class="btn-text">Join Code</span>
                </button>
            </div>
        </div>

        <div class="nav-center">
            <div id="connection-badge" class="connection-badge disconnected">
                <span class="status-dot"></span>
                <span id="connection-text">Connecting...</span>
            </div>

            <div class="theme-dropdown-container">
                <button id="theme-btn" class="theme-btn" title="Change Canvas Theme">
                    <span id="theme-icon">☀️</span>
                    <span id="theme-name" class="btn-text">Light</span>
                    <span class="dropdown-chevron">▾</span>
                </button>
                <div id="theme-menu" class="theme-menu hidden">
                    <button class="theme-option active" data-theme="light">
                        <span class="theme-preview-dot light"></span>
                        <span>☀️ Light Mode</span>
                    </button>
                    <button class="theme-option" data-theme="dark">
                        <span class="theme-preview-dot dark"></span>
                        <span>🌙 Dark Slate</span>
                    </button>
                    <button class="theme-option" data-theme="blueprint">
                        <span class="theme-preview-dot blueprint"></span>
                        <span>📐 Blueprint</span>
                    </button>
                    <button class="theme-option" data-theme="sepia">
                        <span class="theme-preview-dot sepia"></span>
                        <span>📜 Vintage Sepia</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <div class="user-presence">
                <div id="users-avatar-stack" class="avatar-stack"></div>
                <span id="users-count-badge" class="badge">1 online</span>
            </div>
            
            <div class="self-profile">
                <span id="self-avatar" class="user-circle"></span>
                <span id="self-name" class="self-username">You</span>
            </div>
        </div>
    </header>

    <!-- Floating Canvas Toolbar -->
    <nav class="floating-toolbar">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="brush" title="Pen / Brush (P)">
                ✏️
            </button>
            <button class="tool-btn" data-tool="line" title="Line (L)">
                📏
            </button>
            <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
                ⬜
            </button>
            <button class="tool-btn" data-tool="circle" title="Circle (O)">
                ⭕
            </button>
            <button class="tool-btn" data-tool="fill-bucket" title="Paint Bucket / Flood Fill (F)">
                🪣
            </button>
            <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
                    <path d="M22 21H7"/>
                    <path d="m5 11 9 9"/>
                </svg>
            </button>
            <button class="tool-btn" data-tool="pan" title="Pan Hand Tool (H or hold Space)">
                ✋
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Color & Width Popover Triggers -->
        <div class="tool-group">
            <div class="color-picker-wrapper">
                <input type="color" id="primary-color-picker" value="#3B82F6" title="Choose color">
            </div>
            <div class="preset-colors">
                <button class="color-dot active" style="background: #1e293b" data-color="#1e293b" title="Dark Slate"></button>
                <button class="color-dot" style="background: #ef4444" data-color="#ef4444" title="Red"></button>
                <button class="color-dot" style="background: #10b981" data-color="#10b981" title="Emerald"></button>
                <button class="color-dot" style="background: #3b82f6" data-color="#3b82f6" title="Blue"></button>
                <button class="color-dot" style="background: #f59e0b" data-color="#f59e0b" title="Amber"></button>
                <button class="color-dot" style="background: #8b5cf6" data-color="#8b5cf6" title="Purple"></button>
            </div>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Stroke Width Slider -->
        <div class="tool-group size-slider-group">
            <div class="size-preview-dot" id="size-preview-dot"></div>
            <input type="range" id="stroke-size-slider" class="stroke-slider"
                   min="1" max="80" value="4" title="Brush / Eraser Size">
            <span class="size-label" id="size-label">4px</span>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Shape Fill Toggle -->
        <div class="tool-group">
            <button id="toggle-fill-btn" class="toggle-btn" title="Toggle Shape Fill">
                🎨 Fill: <span id="fill-status">Off</span>
            </button>
        </div>
    </nav>

    <!-- Floating Action Controls (Undo, Redo, Zoom, Clear, Export) -->
    <div class="floating-controls bottom-left">
        <button id="undo-btn" class="action-btn" title="Undo (Ctrl+Z)" disabled>
            ↩️
        </button>
        <button id="redo-btn" class="action-btn" title="Redo (Ctrl+Y / Cmd+Shift+Z)" disabled>
            ↪️
        </button>
        <div class="control-divider"></div>
        <button id="zoom-out-btn" class="action-btn" title="Zoom Out (-)">
            🔍−
        </button>
        <span id="zoom-level-text" class="zoom-text">100%</span>
        <button id="zoom-in-btn" class="action-btn" title="Zoom In (+)">
            🔍+
        </button>
        <button id="reset-view-btn" class="action-btn" title="Reset View to 100%">
            🎯
        </button>
    </div>

    <div class="floating-controls bottom-right">
        <button id="export-png-btn" class="btn-secondary" title="Download Canvas as PNG">
            📸 Export PNG
        </button>
        <button id="export-json-btn" class="btn-secondary" title="Export Board State (JSON)">
            💾 Save JSON
        </button>
        <button id="clear-board-btn" class="btn-danger" title="Clear board for all users">
            🗑️ Clear
        </button>
    </div>

    <!-- Eraser Cursor (lightweight DOM element — no canvas redraws) -->
    <div id="eraser-cursor" class="eraser-cursor hidden"></div>

    <!-- Main Canvas Viewport -->
    <main id="viewport" class="canvas-viewport">
        <canvas id="drawing-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
    </main>

    <!-- Modal: Create New Room -->
    <div id="new-room-modal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3>🎨 Create New Whiteboard</h3>
            <p>A new room will be created with a unique 6-character code and shareable link.</p>
            <form id="new-room-form">
                <label for="new-room-name-input">Canvas Name (Optional):</label>
                <input type="text" id="new-room-name-input" placeholder="e.g. Sprint Architecture, Brainstorming" maxlength="40">
                <label for="new-room-user-input">Your Display Name:</label>
                <input type="text" id="new-room-user-input" placeholder="e.g. Alice" maxlength="25">
                <div class="modal-actions">
                    <button type="button" id="new-room-cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Generate Room</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Join Room with Code or Link -->
    <div id="join-room-modal" class="modal-backdrop hidden">
        <div class="modal-card">
            <h3>🚪 Join Collaborative Room</h3>
            <p>Enter a 6-character room code (e.g. <code>K9X2P4</code>) or paste a full room link.</p>
            <form id="join-room-form">
                <label for="join-code-input">Room Code or Invite Link:</label>
                <input type="text" id="join-code-input" placeholder="e.g. K9X2P4 or https://.../?room=K9X2P4" required autocomplete="off">
                <label for="join-username-input">Your Display Name:</label>
                <input type="text" id="join-username-input" placeholder="e.g. Bob" maxlength="25">
                <div class="modal-actions">
                    <button type="button" id="join-cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Join Room</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <span id="toast-message">Copied to clipboard!</span>
    </div>

    <!-- Scripts -->
    <script src="canvas.js"></script>
    <script src="websocket.js"></script>
    <script src="main.js"></script>
</body>
</html>
